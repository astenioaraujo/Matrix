{% extends "base.html" %}
{% block content %}
{% include "components/nav.html" %}

<style>
    .pagina-titulo {
        font-size: 36px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .empresa {
        font-size: 22px;
        margin-bottom: 30px;
    }

    .menu-botoes {
        display: grid;
        grid-template-columns: repeat(auto-fill, 260px);
        gap: 14px;
        margin-bottom: 50px;
    }

    .menu-botoes a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 64px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        color: #fff;
        background: #14114f;
        border: 1px solid #25103c;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        transition: all 0.2s ease;
        text-align: center;
        padding: 0 10px;
    }

    .menu-botoes a:hover {
        transform: translateY(-2px);
        background: #131249;
        border-color: #2b1a58;
    }
</style>

<div class="pagina-titulo">Caixas</div>

<div class="empresa">
    <strong>Empresa:</strong> {{ empresa_ativa }} - {{ nome_empresa_ativa }}
</div>

<div class="menu-botoes">

    {% if pode_atualizar_caixas %}
        <a href="{{ url_for('financeiro.conferir_caixas') }}">
            Conferir Caixas
        </a>
    {% endif %}

    {% if pode_configuracoes_caixas %}
        <a href="{{ url_for('financeiro.configuracoes_caixas') }}">
            Configurar Caixas
        </a>
    {% endif %}

</div>

{% endblock %}
