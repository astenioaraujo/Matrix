{% extends "base.html" %}
{% block content %}
{% include "components/nav.html" %}

<style>
  .pagina-titulo { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
  .empresa { font-size: 18px; margin-bottom: 28px; color: #444; }
  .menu-botoes { display: grid; grid-template-columns: repeat(auto-fill, 260px); gap: 16px; margin-bottom: 40px; }
  .menu-card {
    display: flex; align-items: center; justify-content: center;
    min-height: 68px; padding: 12px 18px; border-radius: 14px;
    color: #fff; text-decoration: none; font-size: 16px; font-weight: 800;
    text-align: center; line-height: 1.15;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14); transition: 0.18s ease;
  }
  .menu-card:hover { transform: translateY(-3px); filter: brightness(0.96); }
  @media (max-width: 700px) { .menu-botoes { grid-template-columns: 1fr; } }
</style>

<div class="pagina-titulo">💰 Finanças Pessoais — Configurações</div>
<div class="empresa">Usuário: <strong>{{ nome_usuario }}</strong></div>

<div class="menu-botoes">
  <a class="menu-card" style="background:#1d4ed8;" href="{{ url_for('canivete.fp_config_contas') }}">
    Contas Bancárias
  </a>
  <a class="menu-card" style="background:#0f766e;" href="{{ url_for('canivete.fp_config_classificacoes') }}">
    Classificações
  </a>
  <a class="menu-card" style="background:#6b21a8;" href="{{ url_for('canivete.fp_config_orcamento') }}">
    Orçamento
  </a>
</div>

{% endblock %}
