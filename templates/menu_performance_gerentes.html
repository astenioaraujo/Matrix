{% extends "base.html" %}

{% block content %}

{% include "components/nav.html" %}

<style>
  .pagina-titulo {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .empresa {
    font-size: 22px;
    margin-bottom: 30px;
  }

  .menu-botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, 220px);
    gap: 14px;
    margin-bottom: 50px;
  }

  .menu-botoes a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
    text-align: center;
    padding: 0 10px;
  }

  .btn-vendas {
    background: #1e5aa8;
    border: 1px solid #1e5aa8;
  }

  .btn-vendas:hover {
    background: #184a8c;
    border-color: #184a8c;
  }
</style>

<div class="pagina-titulo">Performance de Gerentes</div>

<div class="empresa">
  <strong>Empresa:</strong> {{ nome_empresa }}
</div>

<div class="menu-botoes">

  {% if pode_vendas %}
    <a href="{{ url_for('performances.gerentes_vendas') }}" class="btn-vendas">
      Vendas
    </a>
  {% endif %}

</div>

{% endblock %}
