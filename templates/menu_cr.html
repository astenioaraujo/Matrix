{% extends "base.html" %}
{% block content %}
{% include "components/nav.html" %}

<style>
  .pagina-titulo { font-size:34px; font-weight:800; margin-bottom:4px; }
  .empresa       { font-size:16px; color:#555; margin-bottom:30px; }

  .menu-botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, 220px);
    gap: 14px;
    margin-bottom: 50px;
  }
  .menu-botoes a {
    display: flex; align-items: center; justify-content: center;
    height: 60px; border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 16px; color: #fff;
    background: #14114f; border: 1px solid #14114f;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: all 0.2s ease; text-align: center; padding: 0 10px;
  }
  .menu-botoes a:hover { transform: translateY(-2px); background: #0d0a3a; border-color: #0d0a3a; }

  .sep-grupo { grid-column: 1 / -1; border: none; border-top: 2px dashed #cbd5e1; margin: 4px 0; }
  .grupo-label { grid-column: 1 / -1; font-size:12px; font-weight:700; color:#64748b; letter-spacing:.05em; text-transform:uppercase; }
  .menu-botoes a.btn-cartao { background: #0f766e; border-color: #0f766e; }
  .menu-botoes a.btn-cartao:hover { background: #065f46; border-color: #065f46; }
</style>

<div class="pagina-titulo">CR — Contas a Receber</div>
<div class="empresa"><strong>Empresa:</strong> {{ empresa_ativa }} - {{ nome_empresa_ativa }}</div>

<div class="menu-botoes">
  <div class="grupo-label">Fiado</div>
  <a href="{{ url_for('financeiro.cr_importar_fiado') }}">Importar Fiado</a>
  <a href="{{ url_for('financeiro.cr_consultas') }}">Consultar</a>
  <a href="{{ url_for('financeiro.cr_variacoes') }}">Variações</a>
  <a href="{{ url_for('financeiro.cr_por_filial_cliente') }}">Por Filial e Cliente</a>
  <a href="{{ url_for('financeiro.cr_por_cliente') }}">Por Cliente</a>

  <hr class="sep-grupo">
  <div class="grupo-label">Cartões</div>
  <a class="btn-cartao" href="{{ url_for('financeiro.cartoes_importar') }}">Importar Cartões</a>
  <a class="btn-cartao" href="{{ url_for('financeiro.cartoes_consultar') }}">Consultar</a>
  <a class="btn-cartao" href="{{ url_for('financeiro.cartoes_variacoes') }}">Variações</a>
</div>

{% endblock %}
