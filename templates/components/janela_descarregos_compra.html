{# Janela "Descarregos da compra": em que dia(s) a compra foi descarregada.
   Usada em Informar Compras e em Compras em Trânsito — o número é link para
   abrirDescarregos(id_compra). Endpoint: GET /operacoes/api/compras/<id>/descarregos. #}
<style>
  .link-descarregos { color: #1565c0; font-weight: 700; text-decoration: underline dotted; cursor: pointer; }
  .link-descarregos:hover { color: #0d47a1; }

  .janela-desc-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1000; align-items: center; justify-content: center; }
  .janela-desc-overlay.aberta { display: flex; }
  .janela-desc { background: #fff; border-radius: 14px; padding: 20px 22px; max-width: 760px; width: calc(100% - 32px); max-height: 85vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .janela-desc-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .janela-desc-titulo { font-size: 20px; font-weight: 800; }
  .janela-desc-fechar { border: 0; background: #eee; border-radius: 8px; padding: 6px 12px; font-size: 16px; cursor: pointer; }
  .janela-desc table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .janela-desc th, .janela-desc td { padding: 8px 10px; border-bottom: 1px solid #e5e5e5; text-align: left; }
  .janela-desc th { background: #f3f3f3; }
  .janela-desc .num { text-align: right; }
  .janela-desc tfoot td { font-weight: 800; background: #fafafa; }
  .janela-desc .sub { color: #666; font-size: 12px; }

</style>

<div class="janela-desc-overlay" id="janelaDescarregos" onclick="if(event.target===this) fecharDescarregos()">
  <div class="janela-desc">
    <div class="janela-desc-topo">
      <div class="janela-desc-titulo" id="janelaDescTitulo">Descarregos</div>
      <button type="button" class="janela-desc-fechar" onclick="fecharDescarregos()">✕</button>
    </div>
    <div id="janelaDescCorpo"></div>
  </div>
</div>

<script>
// janela da coluna Descarregos: em que dia(s) a compra foi descarregada.
// A data do descarrego costuma ser outra que a da compra.
const URL_CONSULTA_DESCARREGOS = {{ url_for('operacoes.consultar_descarregos_combustiveis') | tojson }};

function fmtLitrosDesc(v){
  return v.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
}

function escDesc(t){
  return String(t ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

function abrirDescarregos(idCompra){
  const corpo = document.getElementById("janelaDescCorpo");
  document.getElementById("janelaDescTitulo").textContent = `Descarregos da compra ${idCompra}`;
  corpo.innerHTML = "Carregando…";
  document.getElementById("janelaDescarregos").classList.add("aberta");

  fetch(`/operacoes/api/compras/${idCompra}/descarregos`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { corpo.textContent = d.erro || "Erro ao carregar os descarregos."; return; }
      if (!d.descarregos.length) { corpo.textContent = "Nenhum descarrego para esta compra."; return; }

      let total = 0;
      const linhas = d.descarregos.map(x => {
        total += x.quantidade;
        const url = `${URL_CONSULTA_DESCARREGOS}?data=${x.data_iso}`;
        return `<tr>
          <td>${x.id_descarrego}</td>
          <td><a href="${url}" title="Abrir a consulta de descarregos deste dia">${x.data}</a><div class="sub">${escDesc(x.dia_semana)}</div></td>
          <td>${escDesc(x.ponta)}</td>
          <td class="num">${fmtLitrosDesc(x.quantidade)}</td>
          <td>${escDesc(x.lancado_em || "")}</td>
        </tr>`;
      }).join("");

      corpo.innerHTML = `<table>
        <thead><tr><th>ID</th><th>Data do descarrego</th><th>Descarregado em</th><th class="num">Qtd</th><th>Lançado em</th></tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot><tr><td colspan="3">Total descarregado (comprado ${fmtLitrosDesc(d.quantidade_comprada)})</td><td class="num">${fmtLitrosDesc(total)}</td><td></td></tr></tfoot>
      </table>`;
    })
    .catch(() => { corpo.textContent = "Erro ao carregar os descarregos."; });
}

function fecharDescarregos(){
  document.getElementById("janelaDescarregos").classList.remove("aberta");
}

document.addEventListener("keydown", e => { if (e.key === "Escape") fecharDescarregos(); });
</script>
