<div class="barra-navegacao">


  <!-- BOTÃO HOME — volta ao menu principal de sistemas -->
  <a class="btn-nav btn-nav-home" href="{{ url_for('sistema.selecionar_sistema') }}"
     title="Ir para o menu principal" aria-label="Menu principal">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5 9.5V21h14V9.5"/>
      <path d="M9.5 21v-6h5v6"/>
    </svg>
  </a>

  <!-- BOTÃO VOLTAR -->
  {% if url_voltar %}
    <a class="btn-nav btn-nav-voltar" href="{{ url_voltar }}">
      {{ texto_voltar or "← Voltar" }}
    </a>
  {% endif %}

  <!-- ATALHOS DE MÓDULO — pula direto para outro sistema; só os que o
       usuário pode abrir (services/modulos_service.py) -->
  {% set _atalhos_mod = atalhos_modulos() %}
  {% if _atalhos_mod|length > 1 %}
    <div class="atalhos-modulos">
      {% for m in _atalhos_mod %}
        <a class="btn-atalho-modulo{% if m.atual %} atual{% endif %}"
           href="{{ m.url }}" data-dica="{{ m.nome }}" aria-label="{{ m.nome }}">{{ m.sigla }}</a>
      {% endfor %}
    </div>
  {% endif %}

</div>

<style>
  .barra-navegacao {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  /* LOGO */
  .logo-area img {
    height: 42px;
    opacity: 0.95;
  }

  /* BOTÕES */
  .btn-nav {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    transition: 0.15s ease;
    border: none;
    box-sizing: border-box;
    white-space: nowrap;
  }

  .btn-nav:hover {
    transform: translateY(-1px);
  }

  /* VOLTAR */
  .btn-nav-voltar {
    background: #fff4a3;
    color: #333;
    border: 1px solid #e6d96a;
  }

  .btn-nav-voltar:hover {
    background: #ffec80;
  }

  /* HOME — só o ícone, quadrado, ao lado do Voltar */
  .btn-nav-home {
    background: #fff4a3;
    color: #333;
    border: 1px solid #e6d96a;
    padding: 10px;
    min-width: 44px;
  }

  .btn-nav-home:hover {
    background: #ffec80;
  }

  /* ATALHOS DE MÓDULO — sigla de 3 letras, no espírito dos chips de
     empresa do topo: cinza discreto, mesma altura da casinha */
  .atalhos-modulos {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding-left: 14px;
    border-left: 1px solid #ddd;
  }

  .btn-atalho-modulo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 50px;
    height: 44px;
    padding: 0 8px;
    border-radius: 10px;
    box-sizing: border-box;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    line-height: 1;
    color: #6b7280;
    background: #ececec;
    border: 1px solid #d6d6d6;
    transition: 0.15s ease;
  }

  .btn-atalho-modulo:hover {
    transform: translateY(-1px);
    color: #374151;
    background: #e0e0e0;
  }

  .btn-atalho-modulo.atual {
    color: #fff;
    background: #6b7280;
    border-color: #6b7280;
    cursor: default;
  }

  .btn-atalho-modulo.atual:hover {
    transform: none;
  }

  /* Dica com o nome completo, logo abaixo do botão. Não usa `title`: a
     dica nativa demora quase um segundo e às vezes nem aparece. */
  .btn-atalho-modulo {
    position: relative;
  }

  .btn-atalho-modulo::after {
    content: attr(data-dica);
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    padding: 5px 9px;
    border-radius: 6px;
    background: #374151;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 50;
  }

  .btn-atalho-modulo:hover::after {
    opacity: 1;
  }

  /* PADRÃO MARROM (se usar depois) */
  .btn-nav-modulo {
    background: #6b4f2a;
    color: #fff;
  }

  .btn-nav-modulo:hover {
    background: #5a4123;
  }
</style>
