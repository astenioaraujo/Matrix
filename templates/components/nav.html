<div class="barra-navegacao">


  <!-- BOTÃO HOME — volta ao menu principal de sistemas -->
  <a class="btn-nav btn-nav-home" href="{{ url_for('sistema.selecionar_sistema') }}"
     title="Ir para o menu principal" aria-label="Menu principal">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5 9.5V21h14V9.5"/>
      <path d="M9.5 21v-6h5v6"/>
    </svg>
  </a>

  <!-- BOTÃO VOLTAR -->
  {% if url_voltar %}
    <a class="btn-nav btn-nav-voltar" href="{{ url_voltar }}">
      {{ texto_voltar or "← Voltar" }}
    </a>
  {% endif %}

</div>

<style>
  .barra-navegacao {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  /* LOGO */
  .logo-area img {
    height: 42px;
    opacity: 0.95;
  }

  /* BOTÕES */
  .btn-nav {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    transition: 0.15s ease;
    border: none;
    box-sizing: border-box;
    white-space: nowrap;
  }

  .btn-nav:hover {
    transform: translateY(-1px);
  }

  /* VOLTAR */
  .btn-nav-voltar {
    background: #fff4a3;
    color: #333;
    border: 1px solid #e6d96a;
  }

  .btn-nav-voltar:hover {
    background: #ffec80;
  }

  /* HOME — só o ícone, quadrado, ao lado do Voltar */
  .btn-nav-home {
    background: #fff4a3;
    color: #333;
    border: 1px solid #e6d96a;
    padding: 10px;
    min-width: 44px;
  }

  .btn-nav-home:hover {
    background: #ffec80;
  }

  /* PADRÃO MARROM (se usar depois) */
  .btn-nav-modulo {
    background: #6b4f2a;
    color: #fff;
  }

  .btn-nav-modulo:hover {
    background: #5a4123;
  }
</style>
