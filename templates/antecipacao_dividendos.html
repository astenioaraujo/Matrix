{% extends "base.html" %}

{% block content %}
{% include "components/nav.html" %}

<style>
  .pagina-titulo { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .empresa { font-size: 17px; margin-bottom: 18px; }

  .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .btn-novo { background: #1e5aa8; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .btn-novo:hover { background: #17488a; }

  .rolagem { overflow-x: auto; background: #fff; border: 1px solid #e2e6ea; border-radius: 10px; padding: 12px; }
  table { border-collapse: collapse; }
  th, td { padding: 6px 8px; font-size: 13px; border-bottom: 1px solid #eceff1; white-space: nowrap; }
  thead th { background: #f5f7f9; font-weight: 700; position: sticky; top: 0; }
  th.area { color: #1e5aa8; text-align: center; border-bottom: 2px solid #1e5aa8; }
  th.num, td.num { text-align: right; }
  .col-data { position: sticky; left: 0; background: #fff; z-index: 2; font-weight: 600; }
  thead .col-data { background: #f5f7f9; z-index: 3; }
  .subtotal { background: #eef4fb; font-weight: 700; }
  .total-geral { background: #e6efe6; font-weight: 700; }

  td input.valor { width: 105px; padding: 4px; border: 1px solid #cfd8dc; border-radius: 5px; text-align: right; font-size: 13px; }
  td input.obs { width: 220px; padding: 4px; border: 1px solid #cfd8dc; border-radius: 5px; font-size: 13px; }
  td input.data { padding: 4px; border: 1px solid #cfd8dc; border-radius: 5px; font-size: 13px; }

  .btn-mini { border: none; border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 5px; }
  .btn-excluir { background: #b3261e; color: #fff; }

  .selo { font-size: 12px; margin-right: 8px; color: #1e7a34; }
  .selo.salvando { color: #8a6d1f; }
  .selo.erro { color: #b3261e; }

  .status-msg { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .status-msg.erro { color: #b3261e; }
  .status-msg.ok { color: #1e7a34; }
</style>

<div class="pagina-titulo">Informar Antecipação de Dividendos</div>

<div class="empresa">
  <strong>Empresa:</strong> {{ empresa_ativa }} - {{ nome_empresa_ativa }}
</div>

<div class="topo">
  <button type="button" class="btn-novo" id="btnNovaData">+ Nova Data</button>
  <span style="color:#666; font-size:14px">Valores retirados das contas, por filial e data. O que você digitar é salvo automaticamente.</span>
</div>

<div class="rolagem">
  <table>
    <thead>
      <tr id="cabAreas"></tr>
      <tr id="cabFiliais"></tr>
    </thead>
    <tbody id="corpo"></tbody>
    <tfoot id="rodape"></tfoot>
  </table>
</div>

<div class="status-msg" id="status"></div>

<script>
  const AREAS = {{ areas | tojson }};

  function mostrarStatus(msg, erro) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "status-msg " + (erro ? "erro" : "ok");
  }

  function formatarValor(v) {
    return (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Tolerante a texto meio digitado: "1.234,5", "1234,", "".
  function paraNumero(txt) {
    if (txt === null || txt === undefined) return 0;
    const limpo = String(txt).replace(/\./g, "").replace(",", ".").replace(/[^0-9.\-]/g, "");
    const n = parseFloat(limpo);
    return isNaN(n) ? 0 : n;
  }

  function hojeISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function montarCabecalho() {
    let linhaAreas = '<th class="col-data"></th><th></th>';
    let linhaFiliais = '<th class="col-data">Data</th><th>Observação</th>';

    AREAS.forEach(a => {
      linhaAreas += `<th class="area" colspan="${a.filiais.length + 1}">${a.nome_area}</th>`;
      a.filiais.forEach(f => {
        linhaFiliais += `<th class="num">${f.nome_filial}</th>`;
      });
      linhaFiliais += '<th class="num subtotal">Subtotal</th>';
    });

    linhaAreas += '<th class="area" rowspan="2">Total Geral</th><th rowspan="2"></th>';
    document.getElementById("cabAreas").innerHTML = linhaAreas;
    document.getElementById("cabFiliais").innerHTML = linhaFiliais;
  }

  function recalcular(tr) {
    let totalGeral = 0;
    AREAS.forEach(a => {
      let subtotal = 0;
      a.filiais.forEach(f => {
        subtotal += paraNumero(tr.querySelector(`.valor[data-filial="${f.cod_filial}"]`).value);
      });
      tr.querySelector(`.sub[data-area="${a.id_area}"]`).textContent = formatarValor(subtotal);
      totalGeral += subtotal;
    });
    tr.querySelector(".tot").textContent = formatarValor(totalGeral);
    recalcularRodape();
  }

  function recalcularRodape() {
    const linhas = [...document.querySelectorAll("#corpo tr")];
    let html = '<tr class="total-geral"><td class="col-data total-geral">Total do quadro</td><td class="total-geral"></td>';
    let totalGeral = 0;

    AREAS.forEach(a => {
      let subtotalArea = 0;
      a.filiais.forEach(f => {
        let soma = 0;
        linhas.forEach(tr => {
          soma += paraNumero(tr.querySelector(`.valor[data-filial="${f.cod_filial}"]`).value);
        });
        subtotalArea += soma;
        html += `<td class="num total-geral">${formatarValor(soma)}</td>`;
      });
      html += `<td class="num subtotal">${formatarValor(subtotalArea)}</td>`;
      totalGeral += subtotalArea;
    });

    html += `<td class="num total-geral">${formatarValor(totalGeral)}</td><td></td></tr>`;
    document.getElementById("rodape").innerHTML = html;
  }

  function linha(dados) {
    const tr = document.createElement("tr");
    const valores = dados.valores || {};
    const salvo = !!dados.data && !dados.nova;

    const obs = (dados.observacao || "").replace(/"/g, "&quot;");
    let html = `<td class="col-data"><input type="date" class="data" value="${dados.data || hojeISO()}" ${salvo ? "disabled" : ""}></td>
                <td><input type="text" class="obs" placeholder="Observação" value="${obs}"></td>`;

    AREAS.forEach(a => {
      a.filiais.forEach(f => {
        const v = valores[String(f.cod_filial)];
        html += `<td class="num"><input type="text" class="valor" data-filial="${f.cod_filial}"
                   value="${v ? formatarValor(v) : ""}"></td>`;
      });
      html += `<td class="num sub subtotal" data-area="${a.id_area}">0,00</td>`;
    });

    html += `<td class="num tot total-geral">0,00</td>
             <td>
               <span class="selo"></span>
               <button type="button" class="btn-mini btn-excluir">Excluir</button>
             </td>`;

    tr.innerHTML = html;
    tr.querySelectorAll(".valor").forEach(i => {
      i.addEventListener("input", () => { recalcular(tr); agendarSalvamento(tr); });
      // Ao sair do campo, formata e grava na hora (sem esperar o debounce).
      i.addEventListener("blur", () => {
        formatarCampo(i);
        salvarAgora(tr);
      });
      // Enter grava na hora e passa para o próximo valor da mesma linha.
      i.addEventListener("keydown", ev => {
        if (ev.key !== "Enter") return;
        ev.preventDefault();
        formatarCampo(i);
        salvarAgora(tr);
        const campos = [...tr.querySelectorAll(".valor")];
        const proximo = campos[campos.indexOf(i) + 1];
        if (proximo) { proximo.focus(); proximo.select(); }
        else { i.blur(); }
      });
    });
    tr._obsSalva = dados.observacao || "";
    const campoObs = tr.querySelector(".obs");
    // A observação NÃO grava a cada tecla: cada prefixo digitado ("Baixa",
    // "Baixa Fi", "Baixa Fiado"…) virava uma linha nova no banco.
    campoObs.addEventListener("blur", () => salvarAgora(tr));
    campoObs.addEventListener("keydown", ev => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      const primeiro = tr.querySelector(".valor");
      if (primeiro) { primeiro.focus(); primeiro.select(); }
      else { campoObs.blur(); }
      salvarAgora(tr);
    });
    tr.querySelector(".data").addEventListener("change", () => salvarAgora(tr));
    tr.querySelector(".btn-excluir").addEventListener("click", () => excluir(tr));
    // Linha que veio do banco já está gravada — não regrava só por ter perdido o foco.
    if (salvo) { tr._ultimoSalvo = assinaturaLinha(tr); selo(tr, "salvo", ""); }
    return tr;
  }

  async function carregar() {
    const corpo = document.getElementById("corpo");
    corpo.innerHTML = "";
    try {
      const resp = await fetch("/api/antecipacao-dividendos");
      const dados = await resp.json();
      if (!resp.ok || !dados.ok) throw new Error(dados.erro || "Erro ao carregar.");
      (dados.linhas || []).forEach(l => {
        const tr = linha(l);
        corpo.appendChild(tr);
        recalcular(tr);
      });
      recalcularRodape();
    } catch (e) {
      mostrarStatus(e.message || "Erro ao carregar.", true);
    }
  }

  const ESPERA_SALVAR = 800;   // ms de silêncio na digitação antes de gravar

  function selo(tr, texto, classe) {
    const el = tr.querySelector(".selo");
    if (!el) return;
    el.textContent = texto;
    el.className = "selo " + (classe || "");
  }

  function formatarCampo(i) {
    i.value = i.value.trim() === "" ? "" : formatarValor(paraNumero(i.value));
  }

  // Enquanto o campo de observação está em foco, a linha continua sendo a que
  // já está no banco — é o texto final (no blur/Enter) que renomeia a linha.
  function obsParaGravar(tr) {
    const campo = tr.querySelector(".obs");
    return document.activeElement === campo ? (tr._obsSalva || "") : campo.value.trim();
  }

  function assinaturaLinha(tr) {
    const valores = {};
    tr.querySelectorAll(".valor").forEach(i => { valores[i.dataset.filial] = paraNumero(i.value); });
    return JSON.stringify([tr.querySelector(".data").value, obsParaGravar(tr), valores]);
  }

  function agendarSalvamento(tr) {
    clearTimeout(tr._timerSalvar);
    selo(tr, "digitando…", "salvando");
    tr._timerSalvar = setTimeout(() => salvarAgora(tr), ESPERA_SALVAR);
  }

  // Grava a linha inteira. Não recarrega a tela: redesenhar durante a digitação
  // é o que causava os valores instáveis na tela de Saldos.
  // Uma gravação de cada vez por linha: com duas em voo (debounce + blur, por
  // exemplo) as duas liam a mesma observação anterior e a segunda inseria uma
  // linha nova em vez de renomear a primeira.
  function salvarAgora(tr) {
    clearTimeout(tr._timerSalvar);
    tr._fila = (tr._fila || Promise.resolve()).then(() => enviarLinha(tr)).catch(() => {});
    return tr._fila;
  }

  async function enviarLinha(tr) {
    // A observação é lida uma vez só, antes do envio: depois do await o foco
    // pode ter mudado e _obsSalva passaria a valer outro texto.
    const obsEnviada = obsParaGravar(tr);
    const data = tr.querySelector(".data").value;
    if (!data) { selo(tr, "informe a data", "erro"); return; }

    const valores = {};
    tr.querySelectorAll(".valor").forEach(i => {
      valores[i.dataset.filial] = paraNumero(i.value);
    });

    const assinatura = assinaturaLinha(tr);
    if (assinatura === tr._ultimoSalvo) { selo(tr, "salvo", ""); return; }

    selo(tr, "salvando…", "salvando");
    try {
      const resp = await fetch("/api/antecipacao-dividendos", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          data, valores,
          observacao: obsEnviada,
          observacao_anterior: tr._obsSalva,
        }),
      });
      const dados = await resp.json();
      if (!resp.ok || !dados.ok) throw new Error(dados.erro || "Erro ao salvar.");
      tr._ultimoSalvo = assinatura;
      tr._obsSalva = obsEnviada;
      // A data de uma linha nova só fica livre até o primeiro save.
      if (tr.dataset.nova === "1") {
        tr.dataset.nova = "0";
        tr.querySelector(".data").disabled = true;
      }
      selo(tr, "salvo", "");
      mostrarStatus("", false);
    } catch (e) {
      selo(tr, "não salvou", "erro");
      mostrarStatus(e.message || "Erro ao salvar.", true);
    }
  }

  function excluir(tr) {
    const data = tr.querySelector(".data").value;
    if (tr.dataset.nova === "1" || !data) { tr.remove(); recalcularRodape(); return; }
    const obs = tr._obsSalva || "(sem observação)";
    mostrarConfirmacaoGlobal(
      "EXCLUIR LANÇAMENTO",
      `Excluir os lançamentos de <strong>${data.split("-").reverse().join("/")}</strong> — ${obs}?`,
      () => excluirConfirmado(tr, data));
  }

  async function excluirConfirmado(tr, data) {
    try {
      const resp = await fetch(
        `/api/antecipacao-dividendos?data=${data}&observacao=${encodeURIComponent(tr._obsSalva || "")}`,
        { method: "DELETE" });
      const dados = await resp.json();
      if (!resp.ok || !dados.ok) throw new Error(dados.erro || "Erro ao excluir.");
      await carregar();
      // Zero removidos é linha que não existia mais no banco — dizer "excluído"
      // aqui seria mentir para quem está olhando a tela.
      mostrarStatus(dados.removidos ? "Lançamento excluído." :
                    "Nada foi excluído: a linha não existe mais no banco.",
                    !dados.removidos);
    } catch (e) {
      mostrarStatus(e.message || "Erro ao excluir.", true);
    }
  }

  document.getElementById("btnNovaData").addEventListener("click", () => {
    const tr = linha({ data: hojeISO(), observacao: "", valores: {}, nova: true });
    tr.dataset.nova = "1";
    document.getElementById("corpo").prepend(tr);
    recalcular(tr);
  });

  montarCabecalho();
  carregar();
</script>

{% endblock %}
