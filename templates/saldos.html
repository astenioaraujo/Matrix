{% extends "base.html" %}
{% block content %}

{% include "components/nav.html" %}

<style>
  .pagina-titulo {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #111;
  }

  .pagina-subtitulo {
    font-size: 20px;
    margin-bottom: 20px;
    color: #222;
  }

  .painel-controles {
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-end;
  }

  .campo label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 13px;
    color: #444;
  }

  .campo select,
  .campo input[type="date"] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #bbb;
    min-width: 160px;
  }

  .campo input[type="date"] {
    font-size: 18px;
    padding: 10px 12px;
    min-height: 44px;
  }

  .chips {
    display: flex;
    gap: 8px;
  }

  .chip {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid #1a73e8;
    background: #fff;
    color: #1a73e8;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .chip:hover {
    background: #eaf1fd;
  }

  .btn-nav-periodo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #1a73e8;
    background: #fff;
    color: #1a73e8;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-nav-periodo:hover {
    background: #eaf1fd;
  }

  .modo-toggle {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #1a73e8;
  }

  .modo-btn {
    padding: 9px 16px;
    background: #fff;
    color: #1a73e8;
    border: none;
    border-right: 1px solid #1a73e8;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .modo-btn:last-child {
    border-right: none;
  }

  .modo-btn.ativo {
    background: #1a73e8;
    color: #fff;
  }

  table.tabela-saldos td.acao-importar {
    border: none;
    background: transparent;
    text-align: left;
    padding-left: 8px;
    white-space: nowrap;
  }

  .btn-importar {
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid #1565c0;
    background: #1565c0;
    color: #fff;
    cursor: pointer;
  }

  .btn-importar:disabled {
    background: #cfd8dc;
    border-color: #b0bec5;
    color: #607d8b;
    cursor: not-allowed;
  }

  .btn-importar.desfazer {
    background: #fff;
    color: #b71c1c;
    border-color: #b71c1c;
  }

  .btn-salvar {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid #1a73e8;
    background: #1a73e8;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .status-msg {
    font-size: 14px;
    font-weight: 700;
    color: #1e6b34;
    min-height: 20px;
    margin-bottom: 16px;
  }

  .status-msg.erro {
    color: #9f2f2f;
  }

  .banner-liberacao {
    background: #fff4e5;
    color: #8a4b00;
    border: 1px solid #f0c27b;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .dia-card {
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .dia-titulo {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
    color: #c0392b;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-competencia {
    font-size: 12px;
    font-weight: 700;
    background: #fff4e5;
    color: #8a4b00;
    border: 1px solid #f0c27b;
    padding: 3px 10px;
    border-radius: 12px;
  }

  .bloco-titulo {
    font-size: 15px;
    font-weight: 800;
    margin: 18px 0 8px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn-duplicar {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #2e9b57;
    background: #2e9b57;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-duplicar:hover {
    background: #25834a;
  }

  /* Grid estilo Excel (mesmo padrão de matricial.html) */
  html, body {
    overflow-x: auto !important;
    overflow-y: auto !important;
    height: auto !important;
    max-height: none !important;
  }

  main, .content, .content-wrapper, .container {
    overflow: visible !important;
    overflow-y: visible !important;
    height: auto !important;
    max-height: none !important;
  }

  .table-wrapper {
    display: block;
    width: max-content;
    min-width: max-content;
    overflow: visible !important;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #fff;
  }

  table.tabela-saldos {
    border-collapse: collapse;
    table-layout: fixed;
    width: auto;
    font-size: 13px;
  }

  table.tabela-saldos th,
  table.tabela-saldos td {
    border: 1px solid #d9d9d9;
    padding: 6px 10px;
    white-space: nowrap;
    overflow: hidden;
  }

  table.tabela-saldos th {
    background: #bdd7ee;
    font-weight: normal;
    text-align: center;
    white-space: normal;
  }

  table.tabela-modo-sistema th {
    background: #d9c7f0;
  }

  table.tabela-saldos th:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
  }

  table.tabela-saldos td.valor,
  table.tabela-saldos th.valor {
    text-align: right !important;
    padding-right: 10px;
  }

  table.tabela-saldos td.rotulo {
    text-align: left;
    font-weight: 600;
    background: #fff;
    white-space: normal;
    position: sticky;
    left: 0;
    z-index: 1;
    box-shadow: 2px 0 4px rgba(0,0,0,0.06);
  }

  table.tabela-saldos td.valor.total {
    font-weight: 800;
    background: #f7f7f7;
    border-left: 2px solid #9a9a9a;
  }

  table.tabela-saldos td.fim-filial,
  table.tabela-saldos th.fim-filial {
    border-right: 3px solid #8f8f8f;
  }

  table.tabela-saldos tr.linha-subtotal td {
    font-weight: 800;
    background: #f3f3f3;
    border-top: 2px solid #9a9a9a;
  }

  table.tabela-saldos tr.linha-subtotal td.rotulo {
    background: #f3f3f3;
  }

  table.tabela-saldos tr.linha-total td {
    font-weight: 800;
    background: #bdd7ee;
    border-top: 2px solid #9a9a9a;
  }

  table.tabela-saldos tr.linha-total td.rotulo,
  table.tabela-saldos tr.linha-total td.valor.total {
    background: #bdd7ee;
  }

  table.tabela-modo-sistema tr.linha-total td {
    background: #d9c7f0;
  }

  table.tabela-modo-sistema tr.linha-total td.rotulo,
  table.tabela-modo-sistema tr.linha-total td.valor.total {
    background: #d9c7f0;
  }

  /* Sem linhas de grade nas tabelas de Variação e Valores Informados, só na linha de total */
  .tabela-variacao td,
  .tabela-variacao th,
  .tabela-informados td,
  .tabela-informados th {
    border: none;
  }

  .tabela-variacao tr.linha-subtotal td,
  .tabela-informados tr.linha-subtotal td {
    border-top: 2px solid #9a9a9a;
  }

  .input-valor {
    width: 100%;
    min-width: 90px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 0 !important;
    outline: none;
    text-align: right;
    font-size: 13px;
    font-family: inherit;
    color: inherit;
    background: transparent;
    appearance: none;
    -webkit-appearance: none;
    box-shadow: none;
  }

  .input-valor:focus {
    /* sem contorno ao editar — o campo em foco fica marcado só pelo fundo */
    outline: none;
    background: #fff;
  }

  .input-valor[readonly] {
    background: transparent;
    color: #555;
  }

  td.valor.diverge {
    background: #e74c3c;
    color: #fff;
    font-weight: 800;
  }

  td.valor.negativo {
    color: #9f2f2f;
  }

  table.tabela-variacao td.valor {
    color: #222;
  }

  table.tabela-variacao tr.linha-subtotal td.valor.negativo {
    color: #9f2f2f;
  }

  .sem-dados {
    padding: 30px;
    text-align: center;
    color: #777;
    font-weight: 600;
  }

  .titulo-modo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 16px;
  }
</style>

<div class="pagina-titulo">Saldos</div>

<div class="pagina-subtitulo">
  <strong>Empresa:</strong> {{ empresa_ativa }} - {{ nome_empresa_ativa }}
</div>

<div class="painel-controles">
  <div class="campo">
    <label>Área</label>
    <select id="selArea">
      {% for a in areas %}
        <option value="{{ a.id_area }}">{{ a.nome_area }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="campo">
    <label>Período rápido</label>
    <div class="chips">
      <button type="button" class="chip" id="chipOntemAnteontem">Anteontem / Ontem</button>
      <button type="button" class="chip" id="chipMes">Desde início do mês</button>
    </div>
  </div>

  <div class="campo">
    <label>&nbsp;</label>
    <button type="button" class="btn-nav-periodo" id="btnPeriodoAnterior" title="Período anterior">←</button>
  </div>

  <div class="campo">
    <label>De</label>
    <input type="date" id="dataInicio">
  </div>

  <div class="campo">
    <label>Até</label>
    <input type="date" id="dataFim">
  </div>

  <div class="campo">
    <label>&nbsp;</label>
    <button type="button" class="btn-nav-periodo" id="btnPeriodoProximo" title="Próximo período">→</button>
  </div>

  <div class="campo">
    <label>Modo de visualização</label>
    <div class="modo-toggle">
      <button type="button" class="modo-btn ativo" data-modo="banco">Bancos</button>
      <button type="button" class="modo-btn" data-modo="sistema">Sistema</button>
      <button type="button" class="modo-btn" data-modo="lado_a_lado">Lado a lado</button>
    </div>
  </div>

  <div class="campo">
    <button type="button" class="btn-salvar" id="btnAtualizar">Atualizar</button>
  </div>
</div>

<div class="banner-liberacao" id="bannerLiberacao" style="display:none"></div>

<div class="status-msg" id="statusSaldos"></div>

<div id="blocosDias"></div>

<script>
  const PODE_LANCAMENTO = {{ pode_lancamento | tojson }};
  const EMPRESA_ATIVA = {{ empresa_ativa | tojson }};
  // Parâmetros de visualização da empresa (Configurar Saldos → Parâmetros de Visualização)
  const MOSTRAR_VALORES_INFORMADOS = {{ config.mostrar_valores_informados | tojson }};
  const MOSTRAR_RECEBIVEIS = {{ config.mostrar_recebiveis | tojson }};
  const MOSTRAR_VARIACOES = {{ config.mostrar_variacoes | tojson }};

  let MODO_ATUAL = "banco";
  let ultimaResposta = null;
  let DATA_MINIMA_EDITAVEL = null;

  function escapeHtml(texto) {
    const div = document.createElement("div");
    div.textContent = texto || "";
    return div.innerHTML;
  }

  function formatarBR(numero) {
    return (Number(numero) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* Aceita texto meio digitado sem virar zero. O .replace(",", ".") trocava
     só a PRIMEIRA vírgula, então um "66,,00" (que aparecia quando o redesenho
     reformatava o campo no meio da digitação) virava Number("66.,00") = NaN
     e era gravado como 0. Aqui a 1ª vírgula é o decimal e as demais são
     descartadas, e os pontos de milhar saem antes da conta. */
  function paraNumero(valorFormatado) {
    if (valorFormatado === null || valorFormatado === undefined) return 0;
    const texto = valorFormatado.toString().trim();
    const negativo = texto.startsWith("-");
    const limpo = texto.replace(/[^\d,]/g, "");
    const [inteiros, ...resto] = limpo.split(",");
    const decimais = resto.join("");
    const numero = Number(inteiros + (resto.length ? "." + decimais : "")) || 0;
    return negativo ? -numero : numero;
  }

  function formatarDataBR(dataIso) {
    const [ano, mes, dia] = dataIso.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  function formatarDataISO(d) {
    const ano = d.getFullYear();
    const mes = String(d.getMonth() + 1).padStart(2, "0");
    const dia = String(d.getDate()).padStart(2, "0");
    return `${ano}-${mes}-${dia}`;
  }

  function parseDataISO(str) {
    const [ano, mes, dia] = str.split("-").map(Number);
    return new Date(ano, mes - 1, dia);
  }

  /* ---------- dias úteis ----------
     A tela só trabalha com dia útil: sábado, domingo e feriado cadastrado
     não geram bloco, e a variação de um dia encosta no dia útil anterior
     (sexta ← segunda). Os feriados vêm do cadastro (Configurar Saldos). */
  let FERIADOS = new Set();

  async function carregarFeriados() {
    try {
      const data = await fetchJson("/api/saldos/feriados");
      FERIADOS = new Set((data.feriados || []).map(f => f.data));
    } catch (e) { /* sem feriados carregados, valem só sábado e domingo */ }
  }

  function ehDiaUtil(d) {
    const diaSemana = d.getDay();
    return diaSemana !== 0 && diaSemana !== 6 && !FERIADOS.has(formatarDataISO(d));
  }

  /* n-ésimo dia útil antes de hoje (1 = "ontem útil", 2 = o anterior a esse) */
  function diaUtilAtras(n) {
    const d = new Date();
    let restantes = n;
    // limite de segurança: sem ele um cadastro de feriados errado viraria laço infinito
    for (let i = 0; i < 400 && restantes > 0; i++) {
      d.setDate(d.getDate() - 1);
      if (ehDiaUtil(d)) restantes--;
    }
    return d;
  }

  /* desloca uma data em `delta` dias úteis (delta pode ser negativo) */
  function deslocarDiasUteis(d, delta) {
    const passo = delta < 0 ? -1 : 1;
    const nova = new Date(d);
    let restantes = Math.abs(delta);
    for (let i = 0; i < 400 && restantes > 0; i++) {
      nova.setDate(nova.getDate() + passo);
      if (ehDiaUtil(nova)) restantes--;
    }
    return nova;
  }

  async function fetchJson(url, opcoes) {
    const resp = await fetch(url, opcoes);
    const contentType = resp.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) {
      throw new Error("Sessão expirada. Atualize a página e faça login novamente.");
    }
    return resp.json();
  }

  function normalizarResposta(resp) {
    resp.dias.forEach(dia => {
      dia.contas_bancarias.forEach(c => {
        c.label = c.banco;
        c.id_item = c.id_conta_bancaria;
      });
      dia.recebiveis.forEach(r => {
        r.label = r.nome;
        r.id_item = r.id_indicador_recebivel;
      });
    });
    return resp;
  }

  // ---------------- RENDERIZAÇÃO ----------------

  function celulaLinha(linha, filial, tipo, dataStr, modo, editavel) {
    const fid = filial.cod_filial;
    if (modo === "lado_a_lado") {
      const vb = linha.saldo_banco[fid] || 0;
      const vs = linha.saldo_sistema[fid] || 0;
      const dif = linha.diferenca[fid] || 0;
      const classeDiverge = dif !== 0 ? "diverge" : "";
      return `<td class="valor ${classeDiverge}">${formatarBR(vb)}</td><td class="valor fim-filial ${classeDiverge}">${formatarBR(vs)}</td>`;
    }
    const campo = modo === "banco" ? "saldo_banco" : "saldo_sistema";
    const valor = linha[campo][fid] || 0;
    // No modo sistema o valor é espelho e não aceita edição:
    //  - estoques e recebíveis, sempre;
    //  - contas bancárias, só as marcadas como "Espelhar no Sistema" no cadastro.
    const ehEspelho = modo === "sistema" &&
      (tipo === "recebivel" || (tipo === "bancario" && linha.espelhar_sistema));
    // Linha importada de Operações não se digita: primeiro "Desfazer importação".
    const soLeitura = !editavel || ehEspelho || linha.importado;
    const dica = linha.importado
      ? ' title="Valor importado — use Desfazer importação para editar"'
      : (ehEspelho ? ' title="Espelho do lado Bancos — edite em Bancos"' : "");
    return `<td class="valor"><input type="text" class="input-valor" data-tipo="${tipo}" data-campo="${campo}" data-data="${dataStr}" data-cod-filial="${fid}" data-id-item="${linha.id_item}" value="${formatarBR(valor)}"${dica} ${soLeitura ? "readonly" : ""}></td>`;
  }

  function celulaTotalLinha(linha, modo) {
    if (modo === "lado_a_lado") {
      return `<td class="valor total">${formatarBR(linha.total_banco)}</td><td class="valor total">${formatarBR(linha.total_sistema)}</td>`;
    }
    const total = modo === "banco" ? linha.total_banco : linha.total_sistema;
    return `<td class="valor total">${formatarBR(total)}</td>`;
  }

  /* Compra de Combustível, Em Trânsito e Estoque podem vir prontos de
     Operações (mesmos números da Consulta de Estoques, em R$). Só aparece
     no modo Bancos, num dia ainda editável e com as movimentações daquele
     dia BLOQUEADAS em Operações — antes disso os números ainda mudam lá. */
  function celulaImportar(linha, dataStr, bloqueioOperacoes, importacaoCr) {
    return `<td class="acao-importar">${botaoImportar(linha, dataStr, bloqueioOperacoes, importacaoCr)}</td>`;
  }

  function botaoImportar(linha, dataStr, bloqueioOperacoes, importacaoCr) {
    // Duas origens de importação, cada uma com a sua condição de liberação:
    //  - estoque (Operações): tudo bloqueado lá até a data;
    //  - CR (Fiado e Cartões): existe a importação do dia seguinte ao saldo.
    const origemCr = linha.origem_cr;
    if (!linha.origem_estoque && !origemCr) return "";

    const fonte = origemCr ? "cr" : "estoque";
    const origem = origemCr || linha.origem_estoque;

    if (linha.importado) {
      return `<button type="button" class="btn-importar desfazer" data-fonte="${fonte}" data-origem="${origem}" data-data="${dataStr}" data-acao="desfazer">↩ Desfazer importação</button>`;
    }

    const liberado = origemCr ? ((importacaoCr || {})[origemCr] === true) : bloqueioOperacoes;
    if (!liberado) {
      const dica = origemCr
        ? "Só depois da importação do dia seguinte em CR → " + (origemCr === "FIADO" ? "Fiado" : "Cartões")
        : "Só depois de bloquear em Operações tudo até esta data";
      return `<button type="button" class="btn-importar" disabled title="${dica}">Importar</button>`;
    }

    return `<button type="button" class="btn-importar" data-fonte="${fonte}" data-origem="${origem}" data-data="${dataStr}" data-acao="importar">Importar</button>`;
  }

  const LARGURA_ROTULO = 220;
  const LARGURA_COL = 110;

  const LARGURA_COL_IMPORTAR = 170;

  function colgroupComTotal(filiais, modo, colunaImportar) {
    const n = modo === "lado_a_lado" ? 2 : 1;
    let cols = `<col style="width:${LARGURA_ROTULO}px">`;
    filiais.forEach(() => {
      for (let i = 0; i < n; i++) cols += `<col style="width:${LARGURA_COL}px">`;
    });
    for (let i = 0; i < n; i++) cols += `<col style="width:${LARGURA_COL}px">`;
    // Coluna de ação depois do TOTAL: o botão fica FORA da célula de total,
    // que é só número. As larguras anteriores são fixas, então a tabela de
    // Contas Bancárias (sem essa coluna) continua alinhada com esta.
    if (colunaImportar) cols += `<col style="width:${LARGURA_COL_IMPORTAR}px">`;
    return `<colgroup>${cols}</colgroup>`;
  }

  function colgroupSimples(filiais, modo, colunaImportar) {
    const largura = modo === "lado_a_lado" ? LARGURA_COL * 2 : LARGURA_COL;
    let cols = `<col style="width:${LARGURA_ROTULO}px">`;
    filiais.forEach(() => { cols += `<col style="width:${largura}px">`; });
    cols += `<col style="width:${largura}px">`;
    if (colunaImportar) cols += `<col style="width:${LARGURA_COL_IMPORTAR}px">`;
    return `<colgroup>${cols}</colgroup>`;
  }

  function classeModo(modo) {
    return modo === "sistema" ? "tabela-modo-sistema" : "";
  }

  function theadColunas(filiais, modo) {
    let cols = "";
    let subhead = "";
    if (modo === "lado_a_lado") {
      filiais.forEach(f => { cols += `<th colspan="2" class="fim-filial">${escapeHtml(f.nome_filial)}</th>`; });
      cols += `<th colspan="2">TOTAL</th>`;
      subhead = '<tr class="subhead"><th></th>';
      filiais.forEach(() => { subhead += '<th>Banco</th><th class="fim-filial">Sistema</th>'; });
      subhead += "<th>Banco</th><th>Sistema</th></tr>";
    } else {
      filiais.forEach(f => { cols += `<th>${escapeHtml(f.nome_filial)}</th>`; });
      cols += `<th>TOTAL</th>`;
    }
    return { cols, subhead };
  }

  function montarThead(cols, subhead, mostrarCabecalho) {
    const linhaNomes = mostrarCabecalho ? `<tr><th></th>${cols}</tr>` : "";
    if (!linhaNomes && !subhead) return "";
    return `<thead>${linhaNomes}${subhead}</thead>`;
  }

  function construirLinhaResumo(rotulo, dados, filiais, modo, comDivergencia, colunaImportar) {
    const classeLinha = comDivergencia ? "linha-total" : "linha-subtotal";
    let linha = `<tr class="${classeLinha}"><td class="rotulo">${rotulo}</td>`;
    filiais.forEach(f => {
      const fid = f.cod_filial;
      if (modo === "lado_a_lado") {
        const vb = dados.banco[fid] || 0;
        const vs = dados.sistema[fid] || 0;
        const divergeClasse = vb - vs !== 0 ? "diverge" : "";
        linha += `<td class="valor ${divergeClasse}">${formatarBR(vb)}</td><td class="valor fim-filial ${divergeClasse}">${formatarBR(vs)}</td>`;
      } else {
        const campo = modo === "banco" ? "banco" : "sistema";
        linha += `<td class="valor">${formatarBR(dados[campo][fid] || 0)}</td>`;
      }
    });
    if (modo === "lado_a_lado") {
      linha += `<td class="valor total">${formatarBR(dados.total_banco)}</td><td class="valor total">${formatarBR(dados.total_sistema)}</td>`;
    } else {
      const totalCampo = modo === "banco" ? "total_banco" : "total_sistema";
      linha += `<td class="valor total">${formatarBR(dados[totalCampo])}</td>`;
    }
    if (colunaImportar) linha += `<td class="acao-importar"></td>`;
    linha += "</tr>";
    return linha;
  }

  function montarTabelaBloco(titulo, linhas, subtotal, tipo, dataStr, filiais, modo, editavel, mostrarCabecalho, totalGeral, mostrarBotaoDuplicar, bloqueioOperacoes, importacaoCr) {
    const { cols, subhead } = theadColunas(filiais, modo);

    // Coluna de importação só existe quando há botão para mostrar: linha ligada
    // a uma origem de estoque, modo Bancos e dia ainda editável.
    const colunaImportar = modo === "banco" && editavel && linhas.some(l => l.origem_estoque || l.origem_cr);

    let corpo = "";
    linhas.forEach(linha => {
      corpo += `<tr><td class="rotulo">${escapeHtml(linha.label)}</td>`;
      filiais.forEach(f => { corpo += celulaLinha(linha, f, tipo, dataStr, modo, editavel); });
      corpo += celulaTotalLinha(linha, modo);
      if (colunaImportar) corpo += celulaImportar(linha, dataStr, bloqueioOperacoes, importacaoCr);
      corpo += "</tr>";
    });

    corpo += construirLinhaResumo("SUBTOTAL", subtotal, filiais, modo, false, colunaImportar);
    if (totalGeral) {
      corpo += construirLinhaResumo("TOTAL", totalGeral, filiais, modo, true, colunaImportar);
    }

    const botaoDuplicar = mostrarBotaoDuplicar
      ? `<button type="button" class="btn-duplicar" data-tipo="${tipo}">↻ Duplicar do dia anterior</button>`
      : "";

    return `
      <div class="bloco-titulo">${titulo}${botaoDuplicar}</div>
      <div class="table-wrapper">
        <table class="tabela-saldos ${classeModo(modo)}">
          ${colgroupComTotal(filiais, modo, colunaImportar)}
          ${montarThead(cols, subhead, mostrarCabecalho)}
          <tbody>${corpo}</tbody>
        </table>
      </div>
    `;
  }

  function montarBlocoVariacao(dia, filiais, modo) {
    const linhas = [
      { label: "Contas Bancárias", valores: dia.variacao.contas },
      ...dia.recebiveis.map(r => ({ label: r.label, valores: r.variacao })),
      { label: "Total", valores: dia.variacao.total, destaque: true },
    ];

    let corpo = "";
    linhas.forEach(l => {
      corpo += `<tr class="${l.destaque ? "linha-subtotal" : ""}"><td class="rotulo">${l.label}</td>`;
      let somaLinha = 0;
      filiais.forEach(f => {
        const v = l.valores[f.cod_filial] || 0;
        somaLinha += v;
        const classeExtra = l.destaque && v < 0 ? "negativo" : "";
        corpo += `<td class="valor ${classeExtra}">${formatarBR(v)}</td>`;
      });
      const classeTotalExtra = l.destaque && somaLinha < 0 ? "negativo" : "";
      corpo += `<td class="valor total valor-total-coluna ${classeTotalExtra}">${formatarBR(somaLinha)}</td>`;
      corpo += "</tr>";
    });

    return `
      <div class="bloco-titulo">Variação (dia a dia)</div>
      <div class="table-wrapper">
        <table class="tabela-saldos tabela-variacao">
          ${colgroupSimples(filiais, modo)}
          <tbody>${corpo}</tbody>
        </table>
      </div>
    `;
  }

  /* Perdas e Sobras também vem de Operações (mesma Consulta de Estoques das
     linhas de estoque, mesmo critério de bloqueio). O botão fica na coluna de
     ação, depois do TOTAL, e vira "Desfazer importação" quando a linha veio
     importada. */
  function botaoImportarInformado(campo, dia, editavel) {
    if (!CAMPOS_INFORMADOS_IMPORTAVEIS.has(campo)) return "";
    if (!editavel) return "";

    if ((dia.informados_importados || []).includes(campo)) {
      return `<button type="button" class="btn-importar desfazer" data-campo="${campo}" data-data="${dia.data}" data-acao="desfazer">↩ Desfazer importação</button>`;
    }
    if (!dia.bloqueio_operacoes) {
      return `<button type="button" class="btn-importar" disabled title="Só depois de bloquear em Operações tudo até esta data">Importar</button>`;
    }
    return `<button type="button" class="btn-importar" data-campo="${campo}" data-data="${dia.data}" data-acao="importar">Importar</button>`;
  }

  const CAMPOS_INFORMADOS_IMPORTAVEIS = new Set(["perdas_sobras"]);

  function montarBlocoInformados(dia, filiais, modo, editavel) {
    const dataStr = dia.data;
    const importados = dia.informados_importados || [];
    const colunaImportar = editavel;
    const campos = [
      { campo: "perdas_sobras", label: "Perdas (+) / Sobras (−)" },
      { campo: "aplicacoes_antecipacoes", label: "Aplicações e Antecipações (+)" },
      { campo: "extras", label: "Extras" },
      { campo: "emprestimos_devolucoes", label: "Empréstimos (+) / Devoluções (−)" },
      { campo: "despesas", label: "Despesas" },
      { campo: "despesas_caixa", label: "Despesas do Caixa" },
    ];

    let corpo = "";
    campos.forEach(c => {
      // Linha importada de Operações não se digita: primeiro "Desfazer importação".
      const importado = importados.includes(c.campo);
      const soLeitura = !editavel || importado;
      const dica = importado
        ? ' title="Valor importado — use Desfazer importação para editar"'
        : "";
      corpo += `<tr><td class="rotulo">${c.label}</td>`;
      let somaLinha = 0;
      filiais.forEach(f => {
        const fid = f.cod_filial;
        const registro = dia.valores_informados[fid] || {};
        const valor = registro[c.campo] || 0;
        somaLinha += valor;
        corpo += `<td class="valor"><input type="text" class="input-valor" data-tipo="informado" data-campo="${c.campo}" data-data="${dataStr}" data-cod-filial="${fid}" value="${formatarBR(valor)}"${dica} ${soLeitura ? "readonly" : ""}></td>`;
      });
      corpo += `<td class="valor total valor-total-coluna">${formatarBR(somaLinha)}</td>`;
      if (colunaImportar) corpo += `<td class="acao-importar">${botaoImportarInformado(c.campo, dia, editavel)}</td>`;
      corpo += "</tr>";
    });

    corpo += `<tr class="linha-subtotal"><td class="rotulo">Variação Final</td>`;
    let somaFinal = 0;
    filiais.forEach(f => {
      const registro = dia.valores_informados[f.cod_filial] || {};
      const v = registro.variacao_final || 0;
      somaFinal += v;
      corpo += `<td class="valor ${v < 0 ? "negativo" : ""}">${formatarBR(v)}</td>`;
    });
    corpo += `<td class="valor total valor-total-coluna ${somaFinal < 0 ? "negativo" : ""}">${formatarBR(somaFinal)}</td>`;
    if (colunaImportar) corpo += `<td class="acao-importar"></td>`;
    corpo += "</tr>";

    return `
      <div class="bloco-titulo">Valores Informados</div>
      <div class="table-wrapper">
        <table class="tabela-saldos tabela-informados">
          ${colgroupSimples(filiais, modo, colunaImportar)}
          <tbody>${corpo}</tbody>
        </table>
      </div>
    `;
  }

  function montarBlocoDia(dia, filiais, modo, editavel, podeDuplicarContas, podeDuplicarRecebiveis) {
    const badge = dia.inicio_competencia ? '<span class="badge-competencia">Início da competência</span>' : "";

    // Variação e Valores Informados só fazem sentido em cima do saldo bancário real (modo Bancos),
    // e cada um ainda depende de a empresa ter ligado a opção em Configurar Saldos →
    // Parâmetros de Visualização — há empresas que não usam esses blocos.
    const blocosDeVariacao = modo === "banco"
      ? `${MOSTRAR_VARIACOES ? montarBlocoVariacao(dia, filiais, modo) : ""}${MOSTRAR_VALORES_INFORMADOS ? montarBlocoInformados(dia, filiais, modo, editavel) : ""}`
      : "";

    // Sem Estoques e Recebíveis não há TOTAL: ele soma os dois blocos, e sozinho
    // em cima das Contas Bancárias repetiria o SUBTOTAL delas.
    const blocoRecebiveis = MOSTRAR_RECEBIVEIS
      ? montarTabelaBloco("Estoques e Recebíveis", dia.recebiveis, dia.subtotal_recebiveis, "recebivel", dia.data, filiais, modo, editavel, false, dia.total, podeDuplicarRecebiveis, dia.bloqueio_operacoes, dia.importacao_cr)
      : "";

    return `
      <div class="dia-card" data-data="${dia.data}">
        <div class="dia-titulo">${formatarDataBR(dia.data)}${dia.dia_semana ? " - " + dia.dia_semana : ""} ${badge}</div>
        ${montarTabelaBloco("Contas Bancárias", dia.contas_bancarias, dia.subtotal_contas, "bancario", dia.data, filiais, modo, editavel, true, null, podeDuplicarContas)}
        ${blocoRecebiveis}
        ${blocosDeVariacao}
      </div>
    `;
  }

  function diasAtras(n) {
    return formatarDataISO(diaUtilAtras(n));
  }

  function blocoTotalmenteVazio(linhas, filiais) {
    return linhas.every(linha =>
      filiais.every(f => (linha.saldo_banco[f.cod_filial] || 0) === 0 && (linha.saldo_sistema[f.cod_filial] || 0) === 0)
    );
  }

  function blocoTemAlgumValor(linhas, filiais) {
    return linhas.some(linha =>
      filiais.some(f => (linha.saldo_banco[f.cod_filial] || 0) !== 0 || (linha.saldo_sistema[f.cod_filial] || 0) !== 0)
    );
  }

  function renderTudo() {
    const container = document.getElementById("blocosDias");
    // o redesenho recria os campos; guarda onde a pessoa estava digitando
    const foco = guardarFoco();
    if (!ultimaResposta || !ultimaResposta.dias || ultimaResposta.dias.length === 0) {
      container.innerHTML = '<div class="sem-dados">Nenhum dado para o período selecionado.</div>';
      return;
    }

    const editavelBase = PODE_LANCAMENTO && MODO_ATUAL !== "lado_a_lado";
    const rotuloModo = { banco: "BANCOS", sistema: "SISTEMA", lado_a_lado: "LADO A LADO" }[MODO_ATUAL];

    const ctx = contextoDuplicacao();

    container.innerHTML = `<div class="titulo-modo">${rotuloModo}</div>` + ultimaResposta.dias
      .map(d => montarBlocoDia(d, ultimaResposta.filiais, MODO_ATUAL, ...contextoDia(d, editavelBase, ctx)))
      .join("");

    ligarEventosCampos(container);
    ligarBotoesDuplicar(container);
    ligarBotoesImportar(container);

    aplicarMapaCalorVariacao();
    aplicarMapaCalorColunaTotal();
    restaurarFoco(foco);
  }

  /* Quais dias (ontem/anteontem) e se dá pra oferecer o botão "Duplicar" —
     mesma regra usada tanto no redesenho completo quanto na atualização de
     um único dia, pra não duplicar a lógica. */
  function contextoDuplicacao() {
    const ontemStr = diasAtras(1);
    const anteontemStr = diasAtras(2);
    const diaOntem = ultimaResposta.dias.find(d => d.data === ontemStr);
    const diaAnteontem = ultimaResposta.dias.find(d => d.data === anteontemStr);

    let podeDuplicarContas = false;
    let podeDuplicarRecebiveis = false;
    if (diaOntem && diaAnteontem) {
      podeDuplicarContas = blocoTotalmenteVazio(diaOntem.contas_bancarias, ultimaResposta.filiais)
        && blocoTemAlgumValor(diaAnteontem.contas_bancarias, ultimaResposta.filiais);
      podeDuplicarRecebiveis = blocoTotalmenteVazio(diaOntem.recebiveis, ultimaResposta.filiais)
        && blocoTemAlgumValor(diaAnteontem.recebiveis, ultimaResposta.filiais);
    }
    return { ontemStr, podeDuplicarContas, podeDuplicarRecebiveis };
  }

  /* Os 4 argumentos de montarBlocoDia para um dia específico */
  function contextoDia(dia, editavelBase, ctx) {
    return [
      editavelBase && (!DATA_MINIMA_EDITAVEL || dia.data >= DATA_MINIMA_EDITAVEL),
      dia.data === ctx.ontemStr && ctx.podeDuplicarContas,
      dia.data === ctx.ontemStr && ctx.podeDuplicarRecebiveis,
    ];
  }

  /* Mesmo modelo de digitação da Conferência de Caixas:
     - ao entrar no campo, mostra o número puro e seleciona tudo;
     - enquanto digita, nada é reescrito;
     - ao sair, formata com separador de milhar e salva.
     A máscara antiga reformatava a cada tecla e dividia por 100, então
     digitar "1000" virava "10,00" e o cursor pulava para o fim a cada
     tecla — daí a sensação de que o número não tinha sido aceito.
     Recebe o escopo (todo o container ou só o card de um dia) pra poder
     religar os campos sem duplicar listener nos que já tinham. */
  function ligarEventosCampos(escopo) {
    escopo.querySelectorAll(".input-valor").forEach(input => {
      input.addEventListener("focus", function () {
        // Durante um redesenho o foco é devolvido por código; reformatar aqui
        // injetaria ",00" no meio do que a pessoa ainda está digitando.
        if (restaurandoFoco) return;
        const v = paraNumero(this.value);
        this.value = v ? v.toFixed(2).replace(".", ",") : "";
        this.select();
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          this.blur();          // o blur formata e salva
        }
      });
      input.addEventListener("blur", function () {
        const v = paraNumero(this.value);
        this.value = v ? formatarBR(v) : "";
        salvarValor(this);
      });
    });
  }

  function ligarBotoesImportar(escopo) {
    escopo.querySelectorAll(".btn-importar[data-acao]").forEach(btn => {
      btn.addEventListener("click", function () {
        // Estoques e recebíveis vão por origem; Valores Informados, por campo.
        if (this.dataset.campo) {
          importarInformado(this.dataset.data, this.dataset.campo, this.dataset.acao);
        } else if (this.dataset.fonte === "cr") {
          importarCr(this.dataset.data, this.dataset.origem, this.dataset.acao);
        } else {
          importarEstoque(this.dataset.data, this.dataset.origem, this.dataset.acao);
        }
      });
    });
  }

  async function chamarImportacao(url, corpo, acao) {
    const status = document.getElementById("statusSaldos");
    status.textContent = acao === "importar" ? "Importando de Operações..." : "Desfazendo importação...";
    status.classList.remove("erro");

    try {
      const dados = await fetchJson(url, {
        method: acao === "importar" ? "POST" : "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo),
      });
      if (dados.ok) {
        status.textContent = acao === "importar" ? "Valores importados de Operações." : "Importação desfeita.";
        await carregarSaldos();
      } else {
        status.textContent = dados.erro || "Erro na importação.";
        status.classList.add("erro");
      }
    } catch (e) {
      status.textContent = e.message || "Erro na importação.";
      status.classList.add("erro");
    }
  }

  function importarInformado(dataStr, campo, acao) {
    return chamarImportacao("/api/saldos/importar-informado", {
      data: dataStr, id_area: Number(document.getElementById("selArea").value), campo: campo,
    }, acao);
  }

  function importarCr(dataStr, origem, acao) {
    return chamarImportacao("/api/saldos/importar-cr", {
      data: dataStr, id_area: Number(document.getElementById("selArea").value), origem: origem,
    }, acao);
  }

  function importarEstoque(dataStr, origem, acao) {
    return chamarImportacao("/api/saldos/importar-estoque", {
      data: dataStr, id_area: Number(document.getElementById("selArea").value), origem: origem,
    }, acao);
  }

  function ligarBotoesDuplicar(escopo) {
    escopo.querySelectorAll(".btn-duplicar").forEach(btn => {
      btn.addEventListener("click", function () {
        duplicarDeAnteontem(this.dataset.tipo);
      });
    });
  }

  /* Soma as linhas de um bloco (contas bancárias ou recebíveis) por filial,
     e atualiza o total de cada linha — mesma fórmula do servidor (rota
     /api/saldos): soma direta de saldo_banco/saldo_sistema, sem depender
     de nenhum outro dia. Serve pra recalcular o TOTAL na hora, sem
     esperar a viagem ao servidor. */
  function somarLinhas(linhas, filiais) {
    const banco = {}, sistema = {};
    filiais.forEach(f => { banco[f.cod_filial] = 0; sistema[f.cod_filial] = 0; });
    linhas.forEach(l => {
      let totalLinhaBanco = 0, totalLinhaSistema = 0;
      filiais.forEach(f => {
        const fid = f.cod_filial;
        const vb = l.saldo_banco[fid] || 0;
        const vs = l.saldo_sistema[fid] || 0;
        banco[fid] += vb;
        sistema[fid] += vs;
        totalLinhaBanco += vb;
        totalLinhaSistema += vs;
      });
      l.total_banco = totalLinhaBanco;
      l.total_sistema = totalLinhaSistema;
    });
    const total_banco = filiais.reduce((s, f) => s + banco[f.cod_filial], 0);
    const total_sistema = filiais.reduce((s, f) => s + sistema[f.cod_filial], 0);
    return { banco, sistema, total_banco, total_sistema };
  }

  /* Recalcula os totais de um dia (Contas Bancárias, Estoques e Recebíveis,
     e o TOTAL geral) e os totais por linha das Valores Informados — tudo
     que só depende dos dados do PRÓPRIO dia. Deliberadamente não mexe em
     dia.variacao nem em variacao_final: essas comparam com o dia anterior,
     e replicar a fórmula do servidor aqui teria risco de dar um número
     errado por um segundo em vez de só atrasado. Ficam para a atualização
     de fundo (agendarAtualizacaoSuave), que continua rodando por baixo. */
  function recomputarTotaisDia(dia, filiais) {
    dia.subtotal_contas = somarLinhas(dia.contas_bancarias, filiais);
    dia.subtotal_recebiveis = somarLinhas(dia.recebiveis, filiais);

    const banco = {}, sistema = {};
    filiais.forEach(f => {
      const fid = f.cod_filial;
      banco[fid] = (dia.subtotal_contas.banco[fid] || 0) + (dia.subtotal_recebiveis.banco[fid] || 0);
      sistema[fid] = (dia.subtotal_contas.sistema[fid] || 0) + (dia.subtotal_recebiveis.sistema[fid] || 0);
    });
    const total_banco = filiais.reduce((s, f) => s + banco[f.cod_filial], 0);
    const total_sistema = filiais.reduce((s, f) => s + sistema[f.cod_filial], 0);
    dia.total = { banco, sistema, total_banco, total_sistema, total_diferenca: total_banco - total_sistema };
  }

  /* Troca só o card de UM dia, sem redesenhar a tela inteira e sem esperar
     o servidor — é o que faz o TOTAL aparecer no mesmo instante em que o
     campo perde o foco, em vez de só no próximo carregarSaldos(). */
  function atualizarCardDia(dataStr) {
    const dia = ultimaResposta && ultimaResposta.dias.find(d => d.data === dataStr);
    const cardAntigo = document.querySelector(`.dia-card[data-data="${dataStr}"]`);
    if (!dia || !cardAntigo) return;   // sem card correspondente: a atualização de fundo resolve

    recomputarTotaisDia(dia, ultimaResposta.filiais);

    const editavelBase = PODE_LANCAMENTO && MODO_ATUAL !== "lado_a_lado";
    const ctx = contextoDuplicacao();
    const html = montarBlocoDia(dia, ultimaResposta.filiais, MODO_ATUAL, ...contextoDia(dia, editavelBase, ctx));

    const foco = guardarFoco();
    const wrapper = document.createElement("div");
    wrapper.innerHTML = html.trim();
    const cardNovo = wrapper.firstElementChild;
    cardAntigo.replaceWith(cardNovo);

    ligarEventosCampos(cardNovo);
    ligarBotoesDuplicar(cardNovo);
    ligarBotoesImportar(cardNovo);
    aplicarMapaCalorVariacao();
    aplicarMapaCalorColunaTotal();
    restaurarFoco(foco);
  }

  async function duplicarDeAnteontem(tipo) {
    const ontemStr = diasAtras(1);
    const anteontemStr = diasAtras(2);
    const diaOntem = ultimaResposta.dias.find(d => d.data === ontemStr);
    const diaAnteontem = ultimaResposta.dias.find(d => d.data === anteontemStr);
    if (!diaOntem || !diaAnteontem) return;

    const linhasAnteontem = tipo === "bancario" ? diaAnteontem.contas_bancarias : diaAnteontem.recebiveis;
    const lancamentos = [];
    linhasAnteontem.forEach(linha => {
      ultimaResposta.filiais.forEach(f => {
        const fid = f.cod_filial;
        const vb = linha.saldo_banco[fid] || 0;
        const vs = linha.saldo_sistema[fid] || 0;
        if (tipo === "bancario") {
          lancamentos.push({ cod_filial: fid, id_conta_bancaria: linha.id_item, saldo_banco: vb, saldo_sistema: vs });
        } else {
          lancamentos.push({ cod_filial: fid, id_indicador_recebivel: linha.id_item, valor_banco: vb, valor_sistema: vs });
        }
      });
    });

    const url = tipo === "bancario" ? "/api/saldos/bancarios" : "/api/saldos/recebiveis";
    const status = document.getElementById("statusSaldos");
    status.textContent = "Duplicando valores do dia anterior...";
    status.classList.remove("erro");

    try {
      const data = await fetchJson(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: diaOntem.data, cod_empresa: EMPRESA_ATIVA, lancamentos }),
      });
      if (data.ok) {
        status.textContent = "Valores duplicados com sucesso.";
        await carregarSaldos();
      } else {
        status.textContent = data.erro || "Erro ao duplicar.";
        status.classList.add("erro");
      }
    } catch (e) {
      status.textContent = e.message || "Erro ao duplicar.";
      status.classList.add("erro");
    }
  }

  // ---------------- MAPA DE CALOR (igual ao matricial.html) ----------------

  function getCorCalor(ratio) {
    let r, g, b;
    if (ratio <= 0.5) {
      const t = ratio / 0.5;
      r = 248 + (255 - 248) * t;
      g = 105 + (235 - 105) * t;
      b = 107 + (132 - 107) * t;
    } else {
      const t = (ratio - 0.5) / 0.5;
      r = 255 + (99 - 255) * t;
      g = 235 + (190 - 235) * t;
      b = 132 + (123 - 132) * t;
    }
    return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
  }

  function aplicarMapaCalorVariacao() {
    document.querySelectorAll(".tabela-variacao tbody tr:not(.linha-subtotal)").forEach(linha => {
      const celulas = Array.from(linha.querySelectorAll("td.valor:not(.valor-total-coluna)"));
      const valores = celulas.map(c => paraNumero(c.textContent));

      if (valores.length < 2) return;

      const min = Math.min(...valores);
      const max = Math.max(...valores);

      celulas.forEach((celula, i) => {
        const valor = valores[i];
        let ratio = (valor - min) / ((max - min) || 1);
        ratio = Math.round(ratio * 50) / 50;
        celula.style.background = getCorCalor(ratio);
      });
    });
  }

  function aplicarMapaCalorColunaTotal() {
    document.querySelectorAll(".tabela-variacao, .tabela-informados").forEach(tabela => {
      const celulas = Array.from(tabela.querySelectorAll("tbody tr:not(.linha-subtotal) td.valor-total-coluna"));
      const valores = celulas.map(c => paraNumero(c.textContent));

      if (valores.length < 2) return;

      const min = Math.min(...valores);
      const max = Math.max(...valores);

      celulas.forEach((celula, i) => {
        let ratio = (valores[i] - min) / ((max - min) || 1);
        ratio = Math.round(ratio * 50) / 50;
        celula.style.background = getCorCalor(ratio);
      });
    });
  }

  // ---------------- SALVAMENTO ----------------

  async function salvarValor(input) {
    if (input.dataset.salvando === "1") return;
    input.dataset.salvando = "1";

    const tipo = input.dataset.tipo;
    const campo = input.dataset.campo;
    const dataStr = input.dataset.data;
    const codFilial = Number(input.dataset.codFilial);
    const novoValor = paraNumero(input.value);

    const dia = ultimaResposta.dias.find(d => d.data === dataStr);
    const status = document.getElementById("statusSaldos");
    status.textContent = "Salvando...";
    status.classList.remove("erro");

    let url, payload;
    let aplicarLocal;   // grava o valor no modelo em memória, só depois de confirmado

    if (tipo === "informado") {
      const registro = dia.valores_informados[codFilial] || {
        perdas_sobras: 0, aplicacoes_antecipacoes: 0, extras: 0, emprestimos_devolucoes: 0, despesas: 0, despesas_caixa: 0,
      };
      const lancamento = {
        cod_filial: codFilial,
        perdas_sobras: registro.perdas_sobras || 0,
        aplicacoes_antecipacoes: registro.aplicacoes_antecipacoes || 0,
        extras: registro.extras || 0,
        emprestimos_devolucoes: registro.emprestimos_devolucoes || 0,
        despesas: registro.despesas || 0,
        despesas_caixa: registro.despesas_caixa || 0,
      };
      lancamento[campo] = novoValor;
      url = "/api/saldos/valores-informados";
      payload = { data: dataStr, cod_empresa: EMPRESA_ATIVA, lancamentos: [lancamento] };
      aplicarLocal = () => {
        dia.valores_informados[codFilial] = registro;
        registro[campo] = novoValor;
      };
    } else {
      const idItem = Number(input.dataset.idItem);
      const lista = tipo === "bancario" ? dia.contas_bancarias : dia.recebiveis;
      const item = lista.find(x => x.id_item === idItem);

      let valorBanco = item.saldo_banco[codFilial] || 0;
      let valorSistema = item.saldo_sistema[codFilial] || 0;
      if (campo === "saldo_banco") valorBanco = novoValor; else valorSistema = novoValor;

      if (tipo === "bancario") {
        url = "/api/saldos/bancarios";
        payload = {
          data: dataStr, cod_empresa: EMPRESA_ATIVA,
          lancamentos: [{ cod_filial: codFilial, id_conta_bancaria: idItem, saldo_banco: valorBanco, saldo_sistema: valorSistema }],
        };
      } else {
        url = "/api/saldos/recebiveis";
        payload = {
          data: dataStr, cod_empresa: EMPRESA_ATIVA,
          lancamentos: [{ cod_filial: codFilial, id_indicador_recebivel: idItem, valor_banco: valorBanco, valor_sistema: valorSistema }],
        };
      }
      aplicarLocal = () => {
        item.saldo_banco[codFilial] = valorBanco;
        item.saldo_sistema[codFilial] = valorSistema;
      };
    }

    try {
      const data = await fetchJson(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (data.ok) {
        status.textContent = "Salvo.";
        setTimeout(() => { if (status.textContent === "Salvo.") status.textContent = ""; }, 1500);
        // Total instantâneo: recalcula em memória (mesma fórmula do
        // servidor) e troca só o card deste dia — sem esperar a viagem ao
        // servidor. A atualização de fundo continua agendada por baixo,
        // pra pegar o que depende de outro dia (variação, mapa de calor).
        aplicarLocal();
        atualizarCardDia(dataStr);
        agendarAtualizacaoSuave();
      } else {
        status.textContent = data.erro || "Erro ao salvar.";
        status.classList.add("erro");
      }
    } catch (e) {
      status.textContent = e.message || "Erro ao salvar.";
      status.classList.add("erro");
    } finally {
      input.dataset.salvando = "0";
    }
  }

  // ---------------- CARREGAMENTO / PERÍODO ----------------

  let timeoutAtualizacaoSuave = null;

  /* Antes, enquanto o foco estivesse em QUALQUER campo de valor, a
     atualização era adiada de 1,5 em 1,5 segundo — indefinidamente. Quem
     digitava a linha inteira pulando de campo em campo nunca soltava o
     foco, então os totais só apareciam ao sair da grade: o "demora um
     minuto". Agora o adiamento conta do último valor salvo, e o foco e o
     texto em digitação são preservados durante o redesenho. */
  function agendarAtualizacaoSuave() {
    if (timeoutAtualizacaoSuave) clearTimeout(timeoutAtualizacaoSuave);
    timeoutAtualizacaoSuave = setTimeout(carregarSaldos, 1200);
  }

  /* Identidade estável de um campo, para reencontrá-lo depois do redesenho */
  function chaveInput(input) {
    const d = input.dataset;
    return [d.tipo, d.campo, d.data, d.codFilial, d.idItem || ""].join("|");
  }

  function guardarFoco() {
    const el = document.activeElement;
    if (!el || !el.classList || !el.classList.contains("input-valor")) return null;
    return {
      chave: chaveInput(el),
      valor: el.value,                 // texto ainda não salvo
      ini: el.selectionStart,
      fim: el.selectionEnd,
    };
  }

  let restaurandoFoco = false;

  function restaurarFoco(estado) {
    if (!estado) return;
    const alvo = Array.from(document.querySelectorAll(".input-valor"))
      .find(i => chaveInput(i) === estado.chave);
    if (!alvo) return;
    // foca primeiro (com o handler de focus silenciado) e só então devolve o
    // texto e o cursor: o que a pessoa estava digitando vale mais que o valor
    // vindo do servidor, e não pode ser reformatado no meio do caminho.
    restaurandoFoco = true;
    alvo.focus();
    restaurandoFoco = false;
    alvo.value = estado.valor;
    try { alvo.setSelectionRange(estado.ini, estado.fim); } catch (e) {}
  }

  async function carregarStatusLiberacao() {
    const elBanner = document.getElementById("bannerLiberacao");
    try {
      const data = await fetchJson("/api/saldos/liberacao-temporaria");
      DATA_MINIMA_EDITAVEL = data.data_minima_editavel;
      if (data.ativa) {
        const expira = new Date(data.expira_em);
        const hora = String(expira.getHours()).padStart(2, "0") + ":" + String(expira.getMinutes()).padStart(2, "0");
        elBanner.textContent = `Liberação temporária ativa (por ${data.ativado_por}): edição liberada desde ${formatarDataBR(data.data_liberada_desde)} até ${hora}.`;
        elBanner.style.display = "block";
      } else {
        elBanner.style.display = "none";
      }
    } catch (e) {
      // se não conseguir checar, mantém o limite normal (ontem/anteontem) já assumido pelo servidor
    }
  }

  async function carregarSaldos() {
    const idArea = document.getElementById("selArea").value;
    const dataInicio = document.getElementById("dataInicio").value;
    const dataFim = document.getElementById("dataFim").value;
    if (!idArea || !dataInicio || !dataFim) return;

    const status = document.getElementById("statusSaldos");
    status.textContent = "Carregando...";
    status.classList.remove("erro");

    try {
      await carregarStatusLiberacao();
      const data = await fetchJson(`/api/saldos?id_area=${idArea}&data_inicio=${dataInicio}&data_fim=${dataFim}`);
      if (!data.ok) {
        status.textContent = data.erro || "Erro ao carregar.";
        status.classList.add("erro");
        document.getElementById("blocosDias").innerHTML = "";
        return;
      }
      ultimaResposta = normalizarResposta(data);
      status.textContent = "";
      renderTudo();
    } catch (e) {
      status.textContent = e.message || "Erro ao carregar.";
      status.classList.add("erro");
    }
  }

  function definirPeriodoOntemAnteontem() {
    // os dois últimos dias úteis — numa segunda-feira, quinta e sexta
    document.getElementById("dataInicio").value = formatarDataISO(diaUtilAtras(2));
    document.getElementById("dataFim").value = formatarDataISO(diaUtilAtras(1));
  }

  async function definirPeriodoDesdeInicioMes() {
    const hoje = new Date();
    const idArea = document.getElementById("selArea").value;
    const ano = hoje.getFullYear();
    const mesAtualStr = `${ano}-${String(hoje.getMonth() + 1).padStart(2, "0")}-01`;
    let dataInicioStr = mesAtualStr;

    try {
      const data = await fetchJson(`/api/competencias?id_area=${idArea}&ano=${ano}`);
      const comp = (data.competencias || []).find(c => c.mes_ano.substring(0, 10) === mesAtualStr);
      if (comp) dataInicioStr = comp.data_corte_inicio.substring(0, 10);
    } catch (e) { /* mantém o fallback do dia 1 do mês */ }

    document.getElementById("dataInicio").value = dataInicioStr;
    document.getElementById("dataFim").value = formatarDataISO(diaUtilAtras(1));
    carregarSaldos();
  }

  document.getElementById("chipOntemAnteontem").addEventListener("click", () => {
    definirPeriodoOntemAnteontem();
    carregarSaldos();
  });

  document.getElementById("chipMes").addEventListener("click", definirPeriodoDesdeInicioMes);
  document.getElementById("btnAtualizar").addEventListener("click", carregarSaldos);
  document.getElementById("selArea").addEventListener("change", carregarSaldos);

  function deslocarPeriodo(deltaDias) {
    // desloca em dias úteis: as setas nunca param num sábado, domingo ou feriado
    const inicio = deslocarDiasUteis(parseDataISO(document.getElementById("dataInicio").value), deltaDias);
    const fim = deslocarDiasUteis(parseDataISO(document.getElementById("dataFim").value), deltaDias);
    document.getElementById("dataInicio").value = formatarDataISO(inicio);
    document.getElementById("dataFim").value = formatarDataISO(fim);
    carregarSaldos();
  }

  document.getElementById("btnPeriodoAnterior").addEventListener("click", () => deslocarPeriodo(-1));
  document.getElementById("btnPeriodoProximo").addEventListener("click", () => deslocarPeriodo(1));

  document.querySelectorAll(".modo-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".modo-btn").forEach(b => b.classList.remove("ativo"));
      btn.classList.add("ativo");
      MODO_ATUAL = btn.dataset.modo;
      renderTudo();
    });
  });

  // os feriados precisam estar carregados antes de escolher o período inicial
  (async () => {
    await carregarFeriados();
    definirPeriodoOntemAnteontem();
    carregarSaldos();
  })();
</script>
