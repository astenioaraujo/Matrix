{% extends "base.html" %}
{% block content %}
{% include "components/nav.html" %}

<style>
  .pagina-titulo { font-size:36px; font-weight:700; margin-bottom:10px; }
  .empresa { font-size:22px; margin-bottom:30px; }

  .menu-botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, 220px);
    gap: 14px;
    margin-bottom: 40px;
  }

  .menu-botoes a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 220px;
    height: 60px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    color: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
    text-align: center;
    padding: 0 10px;
    box-sizing: border-box;
  }

  .menu-botoes a:hover {
    transform: translateY(-2px);
    filter: brightness(0.95);
  }

  .btn-estrategia   { background: #b91c1c; }
  .btn-melhorias    { background: #1d4ed8; }
  .btn-recorrencias { background: #0f766e; }
  .btn-configuracoes { background: #6b7280; }
  .btn-journal      { background: #7c3aed; }
</style>

<div class="card">
  <div class="pagina-titulo">Projetos</div>
  <div class="empresa"><strong>Empresa:</strong> {{ nome_empresa }}</div>

  <div class="menu-botoes">
    <a class="btn-estrategia" href="{{ url_for('projetos.estrategia') }}">
      Estratégia
    </a>
    <a class="btn-melhorias" href="{{ url_for('projetos.melhorias_continuas') }}">
      Melhorias Contínuas
    </a>
    <a class="btn-recorrencias" href="{{ url_for('projetos.recorrencias_mensais') }}">
      Recorrências Mensais
    </a>
    <a class="btn-configuracoes" href="{{ url_for('projetos.configuracoes_projetos') }}">
      Configurações de Projetos
    </a>
    <a class="btn-journal" href="{{ url_for('projetos.project_journal') }}">
      Project Journal
    </a>
  </div>
</div>

{% endblock %}
