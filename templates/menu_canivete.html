{% extends "base.html" %}
{% block content %}
{% include "components/nav.html" %}

<style>
  .pagina-titulo {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .empresa {
    font-size: 22px;
    margin-bottom: 30px;
  }

  .menu-botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, 260px);
    gap: 16px;
    margin-bottom: 50px;
  }

  .menu-card {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    padding: 12px 18px;
    border-radius: 14px;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    line-height: 1.15;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14);
    transition: 0.18s ease;
  }

  .menu-card:hover {
    transform: translateY(-3px);
    filter: brightness(0.96);
  }

  @media (max-width: 700px) {
    .pagina-titulo { font-size: 30px; }
    .empresa { font-size: 18px; }
    .menu-botoes { grid-template-columns: 1fr; }
    .menu-card { min-height: 64px; font-size: 16px; }
  }
</style>

<div class="pagina-titulo">🛠️ Canivete Suíço</div>
<div class="empresa">Empresa: <strong>{{ nome_empresa }}</strong></div>

<div class="menu-botoes">

  {% if pode_financas_pessoais %}
    <a class="menu-card" style="background:#16a34a;" href="{{ url_for('canivete.menu_financas_pessoais') }}">
      💰 Finanças Pessoais
    </a>
  {% endif %}

  {% if pode_agenda %}
    <a class="menu-card" style="background:#1d4ed8;" href="{{ url_for('canivete.agenda') }}">
      📅 Agenda
    </a>
  {% endif %}

</div>

{% endblock %}
